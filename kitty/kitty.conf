# Fuente principal para legibilidad
font_family JetBrains Mono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

# Evitar ruido visual
disable_ligatures always

# Visibilidad en contraste con fondo oscuro
cursor #e6e6e6
cursor_text_color #0d0d0d
cursor_shape block
# Evitar distracciones
cursor_blink_interval 0
shell_integration no-cursor

# Espaciado para respiro visual
window_padding_width 10
# Evitar interrupciones accidentales
confirm_os_window_close 0
# Opacidad sólida por coherencia de filosofía
background_opacity 1.0
placement_strategy center

# Evitar ruidos molestos
enable_audio_bell no
visual_bell_duration 0

# Historial razonable
scrollback_lines 10000

# Esquema monocromático para reducir fatiga
foreground #e6e6e6
background #0d0d0d
selection_foreground #0d0d0d
selection_background #e6e6e6

# Gradiente de grises para colores de terminal
color0 #1f1f1f
color8 #5c5c5c

# Excepción para visibilidad de errores
color1 #a33a3a
color9 #a33a3a

color2 #8a8a8a
color10 #b0b0b0
color3 #8a8a8a
color11 #c0c0c0
color4 #6e6e6e
color12 #9a9a9a
color5 #7a7a7a
color13 #a8a8a8
color6 #8a8a8a
color14 #b8b8b8
color7 #c0c0c0
color15 #e6e6e6

# Enlaces sutiles
url_color #8a8a8a
url_style single

# Pestañas integradas al estilo
active_tab_foreground #e6e6e6
active_tab_background #1f1f1f
inactive_tab_foreground #5c5c5c
inactive_tab_background #161616
tab_bar_style separator
tab_separator " │ "
active_tab_font_style bold
inactive_tab_font_style normal
