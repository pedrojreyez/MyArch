# Configuración principal de Hyprland
# Centraliza la configuración dividiéndola en módulos para mantener el orden

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/keybindings.conf
source = ~/.config/hypr/conf/window-rules.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/autostart.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Degradado sutil en el borde activo para distinguir foco sin color
    col.active_border   = rgba(5c5c5cee) rgba(2a2a2aee) 45deg
    col.inactive_border = rgba(1f1f1faa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    # 8px para coherencia con Waybar, Rofi y SwayNC
    rounding = 8

    active_opacity   = 1.0
    # Diferenciación sutil de ventanas sin foco
    inactive_opacity = 0.96

    shadow {
        enabled      = true
        range        = 14
        render_power = 3
        color        = rgba(00000070)
    }

    # Blur leve para dar profundidad sin perder legibilidad
    blur {
        enabled            = true
        size               = 3
        passes             = 2
        new_optimizations  = true
        ignore_opacity     = true
        xray               = false
    }
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    
    touchpad {
        # Comportamiento natural para evitar fatiga cognitiva al cambiar de SO
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

misc {
    # Evita distracciones visuales al iniciar
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # Ahorro de energía en monitores estáticos
}

dwindle {
    # Evitar reacomodos bruscos al abrir/cerrar
    preserve_split = true
}

debug {
    vfr = true
}
