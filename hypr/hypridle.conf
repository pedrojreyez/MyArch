# Gestión de inactividad
# Políticas de ahorro de energía y seguridad automáticas

general {
    # Bloqueo explícito si hyprlock no está ejecutándose
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Encendido del monitor al reanudar
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    # Seguridad básica al ausentarse (5 min)
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    # Ahorro de energía de pantalla (5.5 min)
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    # Suspensión profunda prolongada (30 min)
    on-timeout = systemctl suspend
}
