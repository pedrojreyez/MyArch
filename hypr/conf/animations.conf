# Animaciones
# Suaves y profesionales, sin rebotes ni overshoot

animations {
    enabled = yes

    # Curvas de easing suave, sin rebote (bounce) ni overshoot
    bezier = smoothDecel, 0.05, 0.9, 0.1, 1.0
    bezier = subtleEase,  0.25, 0.1, 0.25, 1.0

    animation = windows,     1, 3, smoothDecel, popin 90%
    animation = windowsOut,  1, 3, subtleEase,  popin 90%
    animation = border,      1, 4, subtleEase
    animation = borderangle, 1, 8, subtleEase, loop
    animation = fade,        1, 3, subtleEase
    animation = workspaces,  1, 4, smoothDecel, slide
    animation = layers,      1, 3, subtleEase, fade
}
