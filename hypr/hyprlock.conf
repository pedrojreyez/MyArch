# Pantalla de bloqueo
# Seguridad con estilo unificado a la paleta global

background {
    monitor =
    # Fondo primario para coherencia visual
    color = rgba(13, 13, 13, 1.0)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    # Coherente con el rounding global de 8px
    rounding = 8
    
    # Contraste de paleta para estados
    outer_color = rgb(42,42,42)
    inner_color = rgb(22,22,22)
    font_color = rgb(230,230,230)
    
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
    font_family = JetBrains Mono Nerd Font
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrains Mono Nerd Font
    color = rgba(230,230,230,0.85)
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    # Actualización periódica para mantener precisión de fecha
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    color = rgba(138,138,138,0.85)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    color = rgba(138,138,138,0.85)
    position = 0, 30
    halign = center
    valign = center
}
